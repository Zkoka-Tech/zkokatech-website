name: Deploy to GitHub Pages

# Builds the static export (next.config.ts sets output: "export" - this
# site has no server-side features, so `next build` produces a plain
# `out/` folder) and publishes it to GitHub Pages. Requires one manual,
# one-time step in the repo's Settings > Pages: set "Source" to
# "GitHub Actions" (not "Deploy from a branch") - that's what lets this
# workflow publish at all.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
